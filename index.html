<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#bf5700">
  <meta name="description" content="Spin your way through UT Austin: admissions, eight semesters, three summers, and whatever comes next.">
  <title>Longhorn Launch</title>
  <link rel="stylesheet" href="styles.css">
  <script src="company-data.js" defer></script>
  <script src="game-engine.js" defer></script>
  <script src="app.js" defer></script>
</head>
<body>
  <header class="topbar">
    <a class="wordmark" href="#" aria-label="Longhorn Launch home">Longhorn Launch<span>UT AUSTIN CAREER ROULETTE</span></a>
    <nav aria-label="Game controls">
      <button id="outcomes-button">OUTCOMES</button><button id="log-button">RUN LOG</button>
      <button id="help-button" aria-label="How to play">?</button><button id="copy-button">COPY LINK</button>
      <button id="restart-button">NEW RUN</button><button id="mute-button" aria-pressed="true">SOUND OFF</button>
    </nav>
  </header>
  <div id="timeline" class="timeline" aria-label="Semester and summer timeline"></div>
  <main class="cabinet">
    <section id="main" class="main-panel" aria-label="Game">
      <header class="stage-header"><span id="stage-context"></span><h1 id="stage-title"></h1></header>
      <div id="stage" class="stage"></div>
      <div id="result-strip" class="result-strip" role="status" aria-live="polite"></div>
    </section>
    <aside id="character" class="character" aria-label="Your character sheet"></aside>
  </main>
  <dialog id="dialog"><div id="dialog-content"></div></dialog>
  <p class="sr-only" id="announcement" aria-live="polite"></p>
  <noscript>This game needs JavaScript to spin the wheels.</noscript>
</body>
</html>
